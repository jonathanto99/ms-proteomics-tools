[workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[pypi-dependencies]
ms-proteomics-tools = { path = ".", editable = true }
scanpy = "*"
pywebview = "*"
customtkinter = "*"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-proteomics-tools"
version = "0.1.0"
description = "Mass Spectrometry QC and analysis tools for BYU Fritz B. Burns Cancer Research Center MS Core Facility"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
  {name = "Jonathan To", email = "toshuyi@outlook.com"},
]
keywords = ["mass-spectrometry", "proteomics", "data-analysis", "visualization"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bioinformatics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[environments.default.dependencies]
python = ">=3.14,<3.15"
# Core scientific stack
numpy = ">=2.5.1,<3"
pandas = ">=3.0.5,<4"
matplotlib = ">=3.11.1,<4"
seaborn = ">=0.13.2,<0.14"

# Jupyter
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.3.0,<8"
ipywidgets = ">=8.1.8,<9"

# Project and utilities
pyteomics = ">=5.0.1,<6"

# Linting / dev
ruff = ">=0.16.2,<0.17"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"

# Optional / tooling
quarto = ">=1.9.38,<2"
pyinstaller = ">=6.21.0,<7"

# Dataframe alternative (optional)
polars = ">=1.43.2,<2"

# Include scanpy (user-requested analysis package)
scanpy = "*"
expat = ">=2.8.1,<3"

[tasks.start]
cmd = "positron ."

[tasks.lint]
cmd = "ruff check --fix . && ruff format ."

[tasks.test]
cmd = "pytest tests/"

[tasks.type-check]
cmd = "mypy programs/"
